[profile.default]
src = "contracts"
test = "test"
solc_version = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
libs = ["node_modules"]
remappings = ["@openzeppelin/=node_modules/@openzeppelin/"]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 64
fail_on_revert = true

[fmt]
line_length = 100

# The public RPC for each network in src/networks/index.ts. Use the same names with --rpc-url.
[rpc_endpoints]
anvil = "http://127.0.0.1:8545"
ethereum = "https://ethereum-sepolia-rpc.publicnode.com"
base = "https://sepolia.base.org"
monad = "https://testnet-rpc.monad.xyz"
robinhood = "https://rpc.testnet.chain.robinhood.com"
# A private endpoint from the RPC_URL environment variable, so that a keyed URL never
# appears on a command line. scripts/deploy.ts selects it when RPC_URL is set.
private = "${RPC_URL}"
