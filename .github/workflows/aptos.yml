name: Aptos checks
on:
  push:
    branches: [main]
    paths:
      - "implementations/aptos/move/**"
      - "conformance/**"
      - ".github/workflows/aptos.yml"
  pull_request:
    paths:
      - "implementations/aptos/move/**"
      - "conformance/**"
      - ".github/workflows/aptos.yml"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: implementations/aptos/move
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # verify.mjs checks that each evidence revision is in this history.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: implementations/aptos/move/package-lock.json
      - name: Install Aptos CLI
        run: |
          curl --fail --location --retry 3 https://github.com/aptos-labs/aptos-core/releases/download/aptos-cli-v9.6.0/aptos-cli-9.6.0-Ubuntu-24.04-x86_64.zip -o "$RUNNER_TEMP/aptos.zip"
          echo "be21e3f47588560fb309aea1362f93ce2b12c5e88be3d074822a9a7c816a2546  $RUNNER_TEMP/aptos.zip" | sha256sum --check
          # ~/.local/bin is the official location. The SDK's npm wrapper (node_modules/.bin/aptos)
          # looks there; without it, the wrapper downloads its own CLI through the GitHub API.
          mkdir -p "$HOME/.local/bin"
          unzip -q -o "$RUNNER_TEMP/aptos.zip" -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: aptos --version
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:conformance
      # Screenshots and failure context only. .local/ holds keys and is never uploaded, except the node log.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aptos-test-results
          path: |
            implementations/aptos/move/test-results
            implementations/aptos/move/.local/validator.log
          retention-days: 7
