name: Sui checks
on:
  push:
    branches: [main]
    paths:
      - "implementations/sui/move/**"
      - "conformance/**"
      - ".github/workflows/sui.yml"
  pull_request:
    paths:
      - "implementations/sui/move/**"
      - "conformance/**"
      - ".github/workflows/sui.yml"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: implementations/sui/move
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # verify.mjs checks that each evidence revision is in this history.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: implementations/sui/move/package-lock.json
      - name: Install Sui CLI
        run: |
          curl --fail --location --retry 3 https://github.com/MystenLabs/sui/releases/download/testnet-v1.83.1/sui-testnet-v1.83.1-ubuntu-x86_64.tgz -o "$RUNNER_TEMP/sui.tgz"
          echo "1a59344f7e17c3f694c2f17f4a23c29e55293d5d5eb294d0dcafff304b188347  $RUNNER_TEMP/sui.tgz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/sui/bin"
          tar -xzf "$RUNNER_TEMP/sui.tgz" -C "$RUNNER_TEMP/sui/bin" ./sui
          rm "$RUNNER_TEMP/sui.tgz"
          echo "$RUNNER_TEMP/sui/bin" >> "$GITHUB_PATH"
      - run: sui --version | grep -F "sui 1.83.1"
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Playwright starts `npm run local`: a fresh local node, faucet, deployment, and frontend.
      - run: npm run test:e2e
      - run: npm run test:conformance
      # Screenshots and failure context only. .local/ holds keys and is never uploaded.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sui-test-results
          path: |
            implementations/sui/move/test-results
          retention-days: 7
