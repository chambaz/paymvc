name: Sui checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: implementations/sui/move
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: implementations/sui/move/package-lock.json
      - name: Install Sui CLI
        run: |
          curl --fail --location --retry 3 https://github.com/MystenLabs/sui/releases/download/testnet-v1.83.1/sui-testnet-v1.83.1-ubuntu-x86_64.tgz -o "$RUNNER_TEMP/sui.tgz"
          echo "1a59344f7e17c3f694c2f17f4a23c29e55293d5d5eb294d0dcafff304b188347  $RUNNER_TEMP/sui.tgz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/sui/bin"
          tar -xzf "$RUNNER_TEMP/sui.tgz" -C "$RUNNER_TEMP/sui/bin" ./sui
          rm "$RUNNER_TEMP/sui.tgz"
          echo "$RUNNER_TEMP/sui/bin" >> "$GITHUB_PATH"
      - run: sui --version | grep -F "sui 1.83.1"
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Playwright starts `npm run local`: a fresh local node, faucet, deployment, and frontend.
      - run: npm run test:e2e
      - run: node ../../../conformance/verify.mjs
      # Screenshots and failure context only. .local/ holds keys and is never uploaded.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sui-test-results
          path: |
            implementations/sui/move/test-results
          retention-days: 7
